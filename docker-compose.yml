# On-prem deployment (Ubuntu + Docker). Usage:
#   cp .env.example .env            # set ADMIN_TOKEN
#   docker compose up -d --build
#   curl -X POST -H "X-Admin-Token: $ADMIN_TOKEN" http://localhost:8000/admin/ingest -H "Content-Type: application/json" -d '{}'
# UI: http://<server>:8501
name: rag-solution-docs

x-app: &app
  image: rag-solution-docs:${APP_VERSION:-0.1.0}
  env_file: .env
  restart: unless-stopped

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.6}
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    # GPU server: uncomment (requires NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-init:  # one-shot: pulls the models into the shared volume
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.6}
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${RAG_LLM_MODEL:-phi4-mini} && ollama pull nomic-embed-text"]
    restart: "no"

  api:
    <<: *app
    build: .
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./data/docs:/app/data/docs:ro
      - ./eval/golden:/app/eval/golden
      - rag-storage:/app/storage
      - rag-logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"   # API only reachable locally / via reverse proxy
    depends_on:
      ollama-init: { condition: service_completed_successfully }

  ui:
    <<: *app
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      RAG_API_URL: http://api:8000
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api: { condition: service_healthy }

volumes:
  ollama-models:
  rag-storage:
  rag-logs:
